<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">AI development process with skills, gates, and review loops</title>
  <desc id="desc">A workflow diagram showing context loading, skill selection, scoped work, quality gates, human review, recovery, and release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf8"/>
      <stop offset="0.55" stop-color="#eef8fb"/>
      <stop offset="1" stop-color="#fff7df"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#123047" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#4d7f8d"/>
    </marker>
    <style>
      .title { font: 700 44px Georgia, serif; fill: #123047; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #52687a; }
      .lane { fill: rgba(255,255,255,0.62); stroke: #cfe8df; stroke-width: 2; }
      .card { fill: #fff; stroke: #b8d9d2; stroke-width: 2; filter: url(#shadow); }
      .card-accent { fill: #fff9e8; stroke: #efcf78; stroke-width: 2; filter: url(#shadow); }
      .card-warn { fill: #fff3f5; stroke: #f4b8c1; stroke-width: 2; filter: url(#shadow); }
      .step { font: 700 16px Arial, sans-serif; letter-spacing: 4px; fill: #8a9aa8; }
      .heading { font: 700 25px Georgia, serif; fill: #123047; }
      .body { font: 400 17px Arial, sans-serif; fill: #4f6577; }
      .small { font: 700 14px Arial, sans-serif; letter-spacing: 1.4px; fill: #123047; }
      .pill { fill: #e8f6f1; stroke: #cfe8df; stroke-width: 1.4; }
      .line { stroke: #4d7f8d; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .muted-line { stroke: #b8d9d2; stroke-width: 3; fill: none; stroke-dasharray: 8 9; marker-end: url(#arrow); }
      .note { font: 700 20px Arial, sans-serif; fill: #7a5c12; }
    </style>
  </defs>

  <rect width="1600" height="930" fill="url(#bg)"/>

  <text x="88" y="92" class="title">The Setup Matters More Than The Prompt</text>
  <text x="90" y="132" class="subtitle">The reusable AI-assisted delivery loop we kept coming back to across website, DocumentScanner, and ReaperPlugin work.</text>

  <rect x="70" y="185" width="1460" height="170" rx="34" class="lane"/>
  <text x="104" y="228" class="small">SKILLS AND CONTEXT</text>
  <rect x="105" y="250" width="255" height="66" rx="22" class="pill"/>
  <text x="132" y="290" class="body">vander-article-writing</text>
  <rect x="390" y="250" width="190" height="66" rx="22" class="pill"/>
  <text x="430" y="290" class="body">git-ops</text>
  <rect x="610" y="250" width="255" height="66" rx="22" class="pill"/>
  <text x="645" y="290" class="body">code / QA review</text>
  <rect x="895" y="250" width="285" height="66" rx="22" class="pill"/>
  <text x="925" y="290" class="body">project run scripts</text>
  <rect x="1210" y="250" width="260" height="66" rx="22" class="pill"/>
  <text x="1240" y="290" class="body">CURRENT_CONTEXT.md</text>

  <rect x="82" y="410" width="255" height="195" rx="28" class="card"/>
  <text x="112" y="452" class="step">STEP 01</text>
  <text x="112" y="492" class="heading">Load Context</text>
  <text x="112" y="528" class="body">Read current state,</text>
  <text x="112" y="554" class="body">branch status, logs,</text>
  <text x="112" y="580" class="body">and the actual goal.</text>

  <path d="M337 508 H398" class="line"/>

  <rect x="400" y="410" width="255" height="195" rx="28" class="card"/>
  <text x="430" y="452" class="step">STEP 02</text>
  <text x="430" y="492" class="heading">Pick Skills</text>
  <text x="430" y="528" class="body">Use small operating</text>
  <text x="430" y="554" class="body">procedures instead</text>
  <text x="430" y="580" class="body">of one giant prompt.</text>

  <path d="M655 508 H716" class="line"/>

  <rect x="718" y="410" width="255" height="195" rx="28" class="card"/>
  <text x="748" y="452" class="step">STEP 03</text>
  <text x="748" y="492" class="heading">Scope One Run</text>
  <text x="748" y="528" class="body">One article, one UI</text>
  <text x="748" y="554" class="body">slice, one testable</text>
  <text x="748" y="580" class="body">change at a time.</text>

  <path d="M973 508 H1034" class="line"/>

  <rect x="1036" y="410" width="255" height="195" rx="28" class="card-accent"/>
  <text x="1066" y="452" class="step">STEP 04</text>
  <text x="1066" y="492" class="heading">Build + Verify</text>
  <text x="1066" y="528" class="body">Tests, build, sitemap,</text>
  <text x="1066" y="554" class="body">screenshots, browser</text>
  <text x="1066" y="580" class="body">smoke checks.</text>

  <path d="M1291 508 H1352" class="line"/>

  <rect x="1354" y="410" width="155" height="195" rx="28" class="card"/>
  <text x="1384" y="452" class="step">STEP 05</text>
  <text x="1384" y="492" class="heading">Review</text>
  <text x="1384" y="528" class="body">Human taste,</text>
  <text x="1384" y="554" class="body">risk checks,</text>
  <text x="1384" y="580" class="body">final edits.</text>

  <path d="M1430 606 C1430 690 1280 695 1190 672" class="muted-line"/>
  <rect x="890" y="650" width="372" height="162" rx="28" class="card-warn"/>
  <text x="920" y="692" class="step">RECOVERY LOOP</text>
  <text x="920" y="732" class="heading">Stop When State Is Ambiguous</text>
  <text x="920" y="768" class="body">Dirty tree, blocked local validation,</text>
  <text x="920" y="794" class="body">unclear ownership, or broken gates.</text>

  <path d="M1076 650 C950 620 858 610 845 606" class="muted-line"/>

  <rect x="92" y="675" width="590" height="138" rx="28" class="card-accent"/>
  <text x="125" y="720" class="note">The prompt starts the task.</text>
  <text x="125" y="754" class="note">The setup decides whether the result can be repeated,</text>
  <text x="125" y="788" class="note">validated, recovered, and trusted.</text>
</svg>
