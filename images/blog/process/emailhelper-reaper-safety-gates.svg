<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">EmailHelper and ReaperPlugin safety gates</title>
  <desc id="desc">A comparison diagram showing EmailHelper Gmail safeguards and ReaperPlugin preview, apply, undo safeguards around AI-assisted work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbf7"/>
      <stop offset="0.5" stop-color="#eef8fb"/>
      <stop offset="1" stop-color="#fff6df"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#123047" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#4d7f8d"/>
    </marker>
    <style>
      .title { font: 700 42px Georgia, serif; fill: #123047; }
      .subtitle { font: 400 21px Arial, sans-serif; fill: #52687a; }
      .box { fill: #fff; stroke: #b8d9d2; stroke-width: 2; filter: url(#shadow); }
      .box-email { fill: #eef8fb; stroke: #9fd2dd; stroke-width: 2; filter: url(#shadow); }
      .box-reaper { fill: #fff9e8; stroke: #efcf78; stroke-width: 2; filter: url(#shadow); }
      .box-red { fill: #fff3f5; stroke: #f4b8c1; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 15px Arial, sans-serif; letter-spacing: 3.5px; fill: #8494a3; }
      .heading { font: 700 24px Georgia, serif; fill: #123047; }
      .body { font: 400 17px Arial, sans-serif; fill: #506578; }
      .small { font: 400 15px Arial, sans-serif; fill: #637789; }
      .line { stroke: #4d7f8d; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #93bfc7; stroke-width: 3; fill: none; stroke-dasharray: 8 9; marker-end: url(#arrow); }
      .cap { font: 700 20px Arial, sans-serif; fill: #7a5c12; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="82" y="86" class="title">Put The Safety Boundary Close To The Product Risk</text>
  <text x="84" y="126" class="subtitle">The model can help build quickly, but Gmail writes and REAPER edits need different proof before they are trusted.</text>

  <rect x="80" y="195" width="675" height="625" rx="34" class="box-email"/>
  <text x="120" y="242" class="label">EMAILHELPER</text>
  <text x="120" y="286" class="heading">From Read-Only Scan To Guarded Write</text>

  <rect x="125" y="335" width="235" height="120" rx="26" class="box"/>
  <text x="154" y="376" class="heading">Read-Only</text>
  <text x="154" y="412" class="body">gmail.readonly scan</text>
  <text x="154" y="440" class="small">safe to repeat</text>

  <path d="M360 395 H430" class="line"/>

  <rect x="430" y="335" width="260" height="120" rx="26" class="box-red"/>
  <text x="460" y="376" class="heading">Write Boundary</text>
  <text x="460" y="412" class="body">mark selected as read</text>
  <text x="460" y="440" class="small">never casual mutation</text>

  <rect x="125" y="505" width="565" height="210" rx="28" class="box"/>
  <text x="158" y="548" class="label">GUARDS</text>
  <text x="158" y="588" class="body">signed app session + CSRF token</text>
  <text x="158" y="620" class="body">latest persisted summary message validation</text>
  <text x="158" y="652" class="body">50-message cap + gmail.modify scope check</text>
  <text x="158" y="684" class="body">action_ledgers and audit_events records</text>

  <rect x="845" y="195" width="675" height="625" rx="34" class="box-reaper"/>
  <text x="885" y="242" class="label">REAPERPLUGIN</text>
  <text x="885" y="286" class="heading">From Natural Language To Previewable Edit</text>

  <rect x="890" y="335" width="220" height="120" rx="26" class="box"/>
  <text x="920" y="376" class="heading">Interpret</text>
  <text x="920" y="412" class="body">gateway plan</text>
  <text x="920" y="440" class="small">strict schema</text>

  <path d="M1110 395 H1168" class="line"/>

  <rect x="1168" y="335" width="300" height="120" rx="26" class="box-red"/>
  <text x="1198" y="376" class="heading">Session Boundary</text>
  <text x="1198" y="412" class="body">preview before apply</text>
  <text x="1198" y="440" class="small">allow-listed executor</text>

  <rect x="890" y="505" width="578" height="210" rx="28" class="box"/>
  <text x="923" y="548" class="label">GUARDS</text>
  <text x="923" y="588" class="body">interpret -> preview -> apply -> undo</text>
  <text x="923" y="620" class="body">component gates and gateway integration tests</text>
  <text x="923" y="652" class="body">manual REAPER validation for trust and pacing</text>
  <text x="923" y="684" class="body">release pauses when live evidence is missing</text>

  <path d="M410 820 C485 900 690 910 790 872" class="dash"/>
  <path d="M1180 820 C1105 900 900 910 790 872" class="dash"/>

  <rect x="520" y="830" width="560" height="115" rx="30" class="box"/>
  <text x="560" y="874" class="cap">Shared rule: do not count speed until gates pass.</text>
  <text x="560" y="907" class="body">Tests, benchmarks, smoke checks, screenshots, manual validation, and a final risk summary.</text>
</svg>
